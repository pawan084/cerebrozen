name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: FastAPI + Postgres (pytest) ──────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cerebro
          POSTGRES_PASSWORD: cerebro
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerebro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Compile, lint, and formatting checks
        working-directory: backend
        run: |
          python -m compileall -q app tests
          # The legacy tree predates Ruff. Gate the production boundary changed
          # here without creating a 155-file formatting-only migration.
          ruff check app/main.py app/core/config.py app/core/database.py tests/test_auth.py
          ruff format --check app/main.py app/core/config.py app/core/database.py tests/test_auth.py
      # The suite builds its schema with Base.metadata.create_all (init_db), so it
      # never executes a migration — meaning a broken or forked Alembic history is
      # invisible to pytest and green CI can still ship an API that cannot boot.
      # That happened on 2026-07-31: two revisions claimed the same parent, and
      # `prestart.py`'s `upgrade head` refuses to choose between heads.
      # Runs against its own database so the pytest path is untouched.
      - name: Migrations — single head, applies from scratch
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@localhost:5432/migrations_ci
          SECRET_KEY: ci-secret
          PGPASSWORD: cerebro
        run: |
          set -euo pipefail
          psql -h localhost -U cerebro -d cerebro -c 'CREATE DATABASE migrations_ci;'
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            alembic heads
            echo "::error::${heads} Alembic heads — prestart runs 'upgrade head' and cannot pick one. Run 'alembic merge' to join them."
            exit 1
          fi
          # Proves the whole chain applies to an empty database, not just that it parses.
          alembic upgrade head
      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@localhost:5432/cerebro
          SECRET_KEY: ci-secret
          # Voice/AI tests stub the external calls, so these stay unset here and
          # the suite is fully hermetic. Provided for parity with the runtime.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        # Enforce a coverage floor so the suite can't silently regress. The
        # hermetic run sits at ~97%; the gate is set below that with headroom.
        # (prestart/seed + the LangGraph LLM agent are excluded via .coveragerc.)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=95

  # ── Web + Admin: Playwright e2e (isolated docker stack) ───────────────
  e2e:
    name: Web + Admin (Playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision API env
        # Blank secrets => voice loop is simply disabled (stack still passes).
        # Set OPENAI/DEEPGRAM/ELEVENLABS repo secrets to exercise it live.
        run: |
          cp backend/.env.example backend/.env
          {
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}"
            echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
          } >> backend/.env
      - name: Run e2e stack
        run: >-
          docker compose -f docker-compose.e2e.yml up --build
          --abort-on-container-exit --exit-code-from e2e
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ── Web + Admin: TypeScript typecheck + ESLint (no services needed) ───
  web:
    name: Web + Admin + App (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json
            apps/app/package-lock.json
            apps/portal/package-lock.json
      - name: Design-token drift check
        run: node scripts/sync-tokens.mjs --check
      # Android and iOS have had a contrast suite for a while; the web side did
      # not, which is how --muted-2 shipped at 3.9:1 for a month. Gates every
      # text role in design/tokens.css against the grounds it can land on.
      - name: Token contrast check
        run: node scripts/check-contrast.mjs
      # Copy honesty across all four clients (web, app, iOS Swift, Android
      # strings.xml). Review alone let three over-claims ship; see CLAIMS_MAP.md.
      - name: Claims check
        run: node scripts/check-claims.mjs
      # ...and that every test CLAIMS_MAP names is real. Six citations were
      # fiction on 2026-08-12 — two tests nobody had written, four files renamed
      # without the doc following. A claims map that cites a guarantee nobody
      # wrote reads like evidence, which is worse than an empty cell.
      - name: Claims-map citations resolve
        run: node scripts/check-claims-tests.mjs
      # Every quoted price against Products.storekit — what a user is really
      # charged. The Android paywall drifted 25% under every other surface and
      # nothing could notice, because prices are hand-written in four places.
      - name: Price consistency check
        run: node scripts/check-prices.mjs
      # The three middlewares are hand-copied; this pins their security floor
      # (nonce script-src, object-src 'none', …) so one copy can't quietly
      # weaken while the other two look fine.
      - name: CSP floor check
        run: node scripts/check-csp-sync.mjs
      # The crisis directory is hand-duplicated across backend, iOS and Android
      # like the contracts above — but it is the one where drift is measured in
      # human harm. A member in crisis is shown these numbers by the client and
      # told them again by the server (crisis.reply_suffix). They agreed on
      # 2026-08-13 by discipline alone; this keeps them agreeing. Order counts:
      # "Tele-MANAS leads every crisis surface" is a design rule, not a taste.
      - name: Crisis directory consistency
        run: node scripts/check-crisis-lines.mjs
      # --max-warnings=0 on all four: `next lint` exits 0 on warnings, so
      # react-hooks/exhaustive-deps — the rule whose whole job is catching stale
      # closures — was advisory here, and two of them sat in apps/app through a
      # green CI (WEB-01). All four apps were at zero warnings when this landed,
      # so the gate costs nothing today and refuses the next one. Verified by
      # reintroducing a missing dependency in apps/app: exit 1, rule named.
      - name: Typecheck + lint web
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint --max-warnings=0
      - name: Typecheck + lint admin
        working-directory: apps/admin
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint --max-warnings=0
      - name: Typecheck + lint app
        working-directory: apps/app
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint --max-warnings=0
      # The portal built cleanly for weeks while nothing ran it. It is a
      # deployed surface now, so it fails the build like its three siblings.
      - name: Typecheck + lint portal
        working-directory: apps/portal
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint --max-warnings=0

  # ── iOS: SwiftUI UITests (Simulator) ──────────────────────────────────
  # The two live-backend tests (testCloudSync / testCloudChatAndPlan) self-skip
  # here because no API is running on the macOS runner; the other 8 run fully.
  ios:
    name: iOS (XCUITests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run UITests
        working-directory: apps/ios
        run: |
          set -o pipefail
          # Pick a concrete, available iPhone simulator on the runner.
          DEVICE=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone 1[0-9]( Pro)?' | sort -r | head -1)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project CereBro.xcodeproj \
            -scheme CereBro \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore

  # ── Android: the lead client (Gradle build + unit tests + release lint) ──
  # This job was `continue-on-error` from when apps/android was a scaffold, with a
  # note to "flip to blocking once it's built once green". It has been green for
  # months and Android now leads the roadmap, but the flag outlived the scaffold —
  # so on 2026-07-31 a commit carrying a stray `/sdfsdkjfk` in Session.kt failed
  # compileDebugKotlin here, was reported as a non-blocking annotation, and landed
  # on main anyway. Nothing Android could build until it was found by hand.
  # Blocking now: this job is the only thing that compiles the lead client.
  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # matches jvmTarget/sourceCompatibility in app/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The committed wrapper, not a separately pinned `gradle` — one source of
      # truth for the version, so CI cannot drift from what everyone runs locally.
      #
      # `:app:check` is the same gate developers run locally: unit tests, FULL
      # debug lint (the vital-only subset let an UnusedContentLambda bug ship),
      # and the JaCoCo coverage floor (96%). Running a weaker set here meant the
      # coverage gate existed only on machines that chose to run it.
      - name: Full check (tests + lint + coverage gate) + assemble + release lint
        working-directory: apps/android
        run: ./gradlew :app:check :app:assembleDebug :app:lintVitalRelease --no-daemon --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # ── Android: the APK actually starting on Android (WC-281) ────────────
  # Everything above this job runs on the JVM: Robolectric renders Compose
  # without an Android, and RouteReachabilityTest parses the NavHost without
  # rendering it at all. None of that can promise the APK starts — a crash in
  # Application.onCreate, a manifest the merger broke, an API used below minSdk
  # are all invisible there and all fatal to a release. `DeviceSmokeTest` holds
  # only what a JVM cannot answer, which is why it is three tests and not fifty.
  #
  # Held back until now for two reasons, both since closed: infinite Compose
  # animations hung Espresso (fixed by `reduceMotionOverrideForTests`, an in-app
  # hook rather than a device setting), and a locked handset made the suite hang
  # with no verdict (2026-08-17 — now a KeyguardManager check that fails in
  # ~2s with the reason). A managed emulator boots unlocked, so that guard is a
  # no-op here and exists for the phone.
  #
  # Blocking, like the job above, and for the same reason: this repo has already
  # learned what `continue-on-error` does to an Android job. `timeout-minutes`
  # is the backstop instead — a hang costs 25 minutes once, not a stuck queue.
  android-device:
    name: Android (instrumented, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The runner ships KVM disabled for non-root; without this the emulator
      # falls back to software and takes long enough to hit the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 34 matches the handset the suite was written against (CPH2681,
      # Android 14). `google_apis` rather than `default`: the crisis-region test
      # reads TelephonyManager, and while the emulator has no SIM — so it takes
      # the locale-fallback branch — the services build is the closer analogue
      # of a real phone.
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumented results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
