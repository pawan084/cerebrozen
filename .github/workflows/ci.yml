name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: FastAPI + Postgres (pytest) ──────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cerebro
          POSTGRES_PASSWORD: cerebro
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerebro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # The suite builds its schema with Base.metadata.create_all (init_db), so it
      # never executes a migration — meaning a broken or forked Alembic history is
      # invisible to pytest and green CI can still ship an API that cannot boot.
      # That happened on 2026-07-31: two revisions claimed the same parent, and
      # `prestart.py`'s `upgrade head` refuses to choose between heads.
      # Runs against its own database so the pytest path is untouched.
      - name: Migrations — single head, applies from scratch
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@localhost:5432/migrations_ci
          SECRET_KEY: ci-secret
          PGPASSWORD: cerebro
        run: |
          set -euo pipefail
          psql -h localhost -U cerebro -d cerebro -c 'CREATE DATABASE migrations_ci;'
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            alembic heads
            echo "::error::${heads} Alembic heads — prestart runs 'upgrade head' and cannot pick one. Run 'alembic merge' to join them."
            exit 1
          fi
          # Proves the whole chain applies to an empty database, not just that it parses.
          alembic upgrade head
      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@localhost:5432/cerebro
          SECRET_KEY: ci-secret
          # Voice/AI tests stub the external calls, so these stay unset here and
          # the suite is fully hermetic. Provided for parity with the runtime.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        # Enforce a coverage floor so the suite can't silently regress. The
        # hermetic run sits at ~97%; the gate is set below that with headroom.
        # (prestart/seed + the LangGraph LLM agent are excluded via .coveragerc.)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=95

  # ── Web + Admin: Playwright e2e (isolated docker stack) ───────────────
  e2e:
    name: Web + Admin (Playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision API env
        # Blank secrets => voice loop is simply disabled (stack still passes).
        # Set OPENAI/DEEPGRAM/ELEVENLABS repo secrets to exercise it live.
        run: |
          cp backend/.env.example backend/.env
          {
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}"
            echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
          } >> backend/.env
      - name: Run e2e stack
        run: >-
          docker compose -f docker-compose.e2e.yml up --build
          --abort-on-container-exit --exit-code-from e2e
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ── Web + Admin: TypeScript typecheck (no services needed) ────────────
  # No `next lint` here: neither app ships an ESLint config yet.
  web:
    name: Web + Admin + App (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json
            apps/app/package-lock.json
      - name: Design-token drift check
        run: node scripts/sync-tokens.mjs --check
      # Copy honesty across all four clients (web, app, iOS Swift, Android
      # strings.xml). Review alone let three over-claims ship; see CLAIMS_MAP.md.
      - name: Claims check
        run: node scripts/check-claims.mjs
      # Every quoted price against Products.storekit — what a user is really
      # charged. The Android paywall drifted 25% under every other surface and
      # nothing could notice, because prices are hand-written in four places.
      - name: Price consistency check
        run: node scripts/check-prices.mjs
      - name: Typecheck web
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
      - name: Typecheck admin
        working-directory: apps/admin
        run: |
          npm ci
          npx tsc --noEmit
      - name: Typecheck app
        working-directory: apps/app
        run: |
          npm ci
          npx tsc --noEmit

  # ── iOS: SwiftUI UITests (Simulator) ──────────────────────────────────
  # The two live-backend tests (testCloudSync / testCloudChatAndPlan) self-skip
  # here because no API is running on the macOS runner; the other 8 run fully.
  ios:
    name: iOS (XCUITests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run UITests
        working-directory: apps/ios
        run: |
          set -o pipefail
          # Pick a concrete, available iPhone simulator on the runner.
          DEVICE=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone 1[0-9]( Pro)?' | sort -r | head -1)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project CereBro.xcodeproj \
            -scheme CereBro \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore

  # ── Android: the lead client (Gradle build + unit tests + release lint) ──
  # This job was `continue-on-error` from when apps/android was a scaffold, with a
  # note to "flip to blocking once it's built once green". It has been green for
  # months and Android now leads the roadmap, but the flag outlived the scaffold —
  # so on 2026-07-31 a commit carrying a stray `/sdfsdkjfk` in Session.kt failed
  # compileDebugKotlin here, was reported as a non-blocking annotation, and landed
  # on main anyway. Nothing Android could build until it was found by hand.
  # Blocking now: this job is the only thing that compiles the lead client.
  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # matches jvmTarget/sourceCompatibility in app/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The committed wrapper, not a separately pinned `gradle` — one source of
      # truth for the version, so CI cannot drift from what everyone runs locally.
      - name: Unit tests + assemble debug + release lint
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintVitalRelease --no-daemon --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
