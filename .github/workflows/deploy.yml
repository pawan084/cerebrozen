name: Deploy (prod)

# Zero-touch production deploy to the Contabo VPS. Manual-dispatch by default so
# a release goes out only when you choose. Requires the repo to be cloned once on
# the server and backend/.env.production filled in (see docs/RELEASE_PLAN.md).
#
# Repo secrets required:
#   DEPLOY_HOST     e.g. 194.163.182.1  (or api.cerebrozen.in)
#   DEPLOY_USER     e.g. deploy
#   DEPLOY_SSH_KEY  a private key whose public half is in the server's authorized_keys
# Optional repo variable:
#   DEPLOY_PATH     path to the checkout on the server (default: /opt/cerebrozen)
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, rebuild, health-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH || '/opt/cerebrozen' }}
            test -z "$(git status --porcelain)" || { echo "Deployment checkout has local changes; refusing to overwrite them."; exit 1; }
            git fetch origin main
            git merge --ff-only origin/main
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            install -d -m 700 backups
            cp --preserve=mode,timestamps backend/.env.production "backups/env.production.${stamp}"
            docker compose -f docker-compose.prod.yml --env-file backend/.env.production exec -T db \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "backups/postgres.${stamp}.dump"
            docker compose -f docker-compose.prod.yml --env-file backend/.env.production build
            docker compose -f docker-compose.prod.yml --env-file backend/.env.production \
              --profile tools run --rm migrate
            docker compose -f docker-compose.prod.yml --env-file backend/.env.production up -d --no-build

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://api.cerebrozen.in/ready | grep -q '"status":"ready"'; then
              echo "API healthy ✓"; exit 0
            fi
            echo "waiting for API… ($i/10)"; sleep 6
          done
          echo "API did not become healthy"; exit 1
