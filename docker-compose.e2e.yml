# Isolated end-to-end test stack. Runs entirely on its own network with no host
# port mappings, so it won't clash with the dev stack.
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
name: cerebro-e2e
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro
      POSTGRES_DB: cerebro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # `api.cerebro.test` alongside the plain `api` name, so the admin console can
    # reach the API on a host that is SAME-SITE with its own (register E40).
    #
    # Production serves admin.cerebrozen.in and api.cerebrozen.in — two hosts
    # under one registrable domain — so the admin's httpOnly refresh cookie,
    # SameSite=Lax, is sent on every refresh. This stack used the service names
    # `admin` and `api`, which are two *different* sites, so Lax correctly
    # withheld the cookie and a reload signed the operator out. The environment
    # was the thing that did not match production, so it is the environment that
    # changed: weakening the cookie to SameSite=None would have made the suite
    # pass by testing something the product does not do.
    #
    # `.test` is a reserved TLD and not on the Public Suffix List, so browsers
    # treat `cerebro.test` as the registrable domain and the two subdomains as
    # same-site — the exact relationship cerebrozen.in has in production.
    networks:
      default:
        aliases:
          - api.cerebro.test
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@db:5432/cerebro
      # Browsers in the e2e network load pages from these origins.
      CORS_ORIGINS: http://web:3000,http://admin:3001,http://app:3002,http://portal:3003,http://admin.cerebro.test:3001
      # Every browser test shares one IP, so the 10/minute signup limit trips
      # partway through a suite and makes it flaky rather than catching abuse.
      # Production refuses to boot with this off (Settings._guard_production).
      RATE_LIMIT_ENABLED: "0"
    healthcheck:
      # api-gated waits on this, so the two instances cannot run Alembic against
      # one database at the same moment.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  # ── The same API with every gate switched ON ───────────────────────────
  #
  # The main `api` above deliberately runs with the gates off: every browser
  # test shares one IP, so real rate limits make the suite flaky, and the
  # verification gate is inert without SMTP. That is the right default and it
  # left the *enabled* half of three features — bot challenge, email
  # verification, account rate limiting — exercised only by unit tests.
  #
  # This second instance closes that. Same image, same database, gates on, and
  # `gated-api.spec.ts` drives it over real HTTP.
  challenge-stub:
    image: python:3.12-alpine
    # Stands in for Cloudflare/hCaptcha. Answers success ONLY for the magic
    # token, so one instance can exercise both the accept and the refuse path —
    # and so accounts can still be created here to test everything downstream.
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        from urllib.parse import parse_qs
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get("content-length", 0))
                body = parse_qs(self.rfile.read(n).decode())
                ok = body.get("response", [""])[0] == "e2e-good"
                payload = b'{"success": true}' if ok else b'{"success": false, "error-codes": ["invalid-input-response"]}'
                self.send_response(200)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(payload)))
                self.end_headers()
                self.wfile.write(payload)
            def log_message(self, *a): pass
        HTTPServer(("0.0.0.0", 9000), H).serve_forever()

  api-gated:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@db:5432/cerebro
      # Non-empty is the whole switch: verification.gate_active() reads it, and
      # send_email swallows the failure to reach a host that does not exist.
      SMTP_HOST: smtp.invalid
      BOT_CHALLENGE_SECRET: e2e-secret
      BOT_CHALLENGE_VERIFY_URL: http://challenge-stub:9000/siteverify
      # On, unlike the main instance — this is where the account-keyed limit is
      # actually proven to bite.
      RATE_LIMIT_ENABLED: "1"
      TRUSTED_PROXY_HOPS: "1"
      UNVERIFIED_DAILY_MESSAGES: "3"
    # No host port on purpose: the e2e runner reaches it on the compose network,
    # and publishing one only collides with whatever is already on 8001.
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      challenge-stub:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        # Browsers in the e2e network reach the API by service name.
        NEXT_PUBLIC_API_URL: http://api:8000
        # Same for the app the landing links into — otherwise every "Open the
        # app" href would be localhost:3002, unreachable from the e2e container.
        NEXT_PUBLIC_APP_URL: http://app:3002
    depends_on:
      - api

  admin:
    build:
      context: ./apps/admin
      args:
        # Same-site with the admin's own host below, so the refresh cookie
        # behaves here exactly as it will behind Caddy in production.
        NEXT_PUBLIC_API_URL: http://api.cerebro.test:8000
    networks:
      default:
        aliases:
          - admin.cerebro.test
    depends_on:
      - api

  app:
    build:
      context: ./apps/app
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

  portal:
    build:
      context: ./apps/portal
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

  e2e:
    build: ./e2e
    # Same file the api seeds from, so the portal test signs in as the admin
    # that actually exists rather than a hardcoded dev default. ADMIN_EMAIL and
    # ADMIN_PASSWORD are the only keys it reads.
    env_file:
      - ./backend/.env
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web:3000
      # The admin is driven on its same-site host so the browser sees the
      # production cookie relationship (see the api service's aliases).
      ADMIN_URL: http://admin.cerebro.test:3001
      APP_URL: http://app:3002
      PORTAL_URL: http://portal:3003
      # The second API, with the bot challenge, verification gate and rate
      # limits all switched on (see the api-gated service).
      GATED_API_URL: http://api-gated:8000
    depends_on:
      - api-gated
      - web
      - admin
      - app
      - portal
